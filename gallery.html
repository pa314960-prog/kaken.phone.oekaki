<!DOCTYPE html>
<!--
  gallery.html
  投影・集計用画面(PC/プロジェクター表示を想定)。
  Firestoreの投稿をリアルタイム購読し、新着順にグリッド表示する。
  右側にはdraw.htmlへ遷移するためのQRコードを表示する。
-->
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>らくがきウォール - 壁面表示</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/gallery.css" />
</head>
<body>
  <div class="gallery-page">
    <header class="gallery-header">
      <div class="gallery-header-left">
        <a class="pill-link back-link" href="draw.html">← お絵かき画面に戻る</a>
        <h1 class="app-title">らくがき<span class="accent">ウォール</span></h1>
        <p class="app-sub">QRコードを読み込んで、みんなで一枚の壁を作ろう</p>
      </div>
      <div class="post-counter"><span class="count" id="postCount">0</span>件の投稿</div>
    </header>

    <div class="gallery-body">
      <main class="gallery-main" id="galleryMain">
        <div class="empty-state" id="emptyState">
          <p>まだ投稿がありません。</p>
          <p>QRコードを読み込んで最初の一枚を送ってみよう。</p>
        </div>
        <div class="gallery-grid" id="galleryGrid"></div>
      </main>

      <aside class="qr-sidebar">
        <div class="qr-card">
          <div id="qrcode"></div>
        </div>
        <p class="qr-caption">スマホでQRコードを<br />読み込んで<span class="strong">参加</span></p>
      </aside>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="config.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/qr-display.js"></script>
  <script src="js/gallery.js"></script>
</body>
</html>
